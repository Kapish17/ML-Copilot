[pytest]
# The repository holds five independent components with their own test
# suites. Running pytest from the repository root exercises all five;
# `pythonpath` makes `app` (from backend/) and `ml`, `rag`, `llm` and `agent`
# (from the root) importable without installing any of them.
testpaths = backend/tests ml/tests rag/tests llm/tests agent/tests
pythonpath = . backend
addopts = --strict-markers
markers =
    external: talks to a real external service. Skipped unless explicitly
        opted into with an environment variable; never part of a normal run.
    slow: exercises the real ML pipeline end to end. Part of a normal run —
        the marker exists so a developer can skip these with `-m "not slow"`
        while iterating.
