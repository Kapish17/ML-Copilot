[pytest]
# The repository holds four independent components with their own test
# suites. Running pytest from the repository root exercises all four;
# `pythonpath` makes `app` (from backend/) and `ml`, `rag` and `llm` (from the
# root) importable without installing any of them.
testpaths = backend/tests ml/tests rag/tests llm/tests
pythonpath = . backend
addopts = --strict-markers
markers =
    external: talks to a real external service. Skipped unless explicitly
        opted into with an environment variable; never part of a normal run.
