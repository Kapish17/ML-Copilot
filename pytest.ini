[pytest]
# The repository holds three independent components with their own test
# suites. Running pytest from the repository root exercises all three;
# `pythonpath` makes `app` (from backend/) and `ml` and `rag` (from the root)
# importable without installing any of them.
testpaths = backend/tests ml/tests rag/tests
pythonpath = . backend
addopts = --strict-markers
